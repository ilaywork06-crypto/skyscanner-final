[project]
name = "ag-grid-lib"
version = "0.1.0"
description = "Schema introspection, column generation and data source integration for the AG Grid tables"
requires-python = ">=3.11"
dependencies = [
    "skyscanner-models",
    "pydantic>=2.9.0",
    "motor>=3.6.0",
]

[tool.uv.sources]
skyscanner-models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ag_grid_lib"]
