[project]
name = "skyscanner-models"
version = "0.1.0"
description = "Shared API models for every Skyscanner service - pydantic only, no runtime dependencies"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyscanner_models"]
