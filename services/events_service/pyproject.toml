[project]
name = "events-service"
version = "0.1.0"
description = "The service that manages the event inventory, the entities inside it and the dynamic schema"
requires-python = ">=3.11"
dependencies = [
    "skyscanner-models",
    "skyscanner-common",
    "ag-grid-lib",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
]

[tool.uv.sources]
skyscanner-models = { workspace = true }
skyscanner-common = { workspace = true }
ag-grid-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/events_service"]
