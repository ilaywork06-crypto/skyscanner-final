server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2048m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The identity headers below are the hand over point to the authenticating reverse proxy.
    # Replace the static values with the ones your proxy resolves from its API token.
    proxy_set_header X-Auth-User $http_x_auth_user;
    proxy_set_header X-Auth-Email $http_x_auth_email;
    proxy_set_header X-Auth-Roles $http_x_auth_roles;
    proxy_set_header X-Auth-Industries $http_x_auth_industries;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/storage/ {
        proxy_pass http://storage-service:8001;
        proxy_request_buffering off;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service:8002;
    }

    location /api/ {
        proxy_pass http://events-service:8000;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
