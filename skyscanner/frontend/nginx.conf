server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The ordinary upload puts a whole pick into one request, so the ceiling here is what caps a single file
    # taking that road. A very large file takes the other one instead - `POST /api/storage/artifacts/uploads`
    # opens an upload the browser writes part by part - and no part of that is ever more than a few megabytes,
    # so this is a ceiling on convenience rather than on how large a file the system accepts.
    client_max_body_size 2048m;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The identity headers below are the hand over point to the authenticating reverse proxy.
    # Replace the static values with the ones your proxy resolves from its API token.
    proxy_set_header X-Auth-User $http_x_auth_user;
    proxy_set_header X-Auth-Email $http_x_auth_email;
    proxy_set_header X-Auth-Roles $http_x_auth_roles;
    proxy_set_header X-Auth-Industries $http_x_auth_industries;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/storage/ {
        proxy_pass http://storage-service:8001;

        # The bytes are handed straight to the service rather than gathered here first, which is what keeps a
        # large upload from being written to this container's disk on its way past.
        proxy_request_buffering off;

        # A reader paging through a sheet of several gigabytes asks for a window of it at a time, and a
        # buffered answer would have nginx pull the whole stream before passing any of it on. The range
        # header itself has to survive the hop as well, or every window would come back as the whole file.
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # An upload that is interrupted is resumed rather than restarted, so the wait may legitimately be a
        # long one on either side of the hop.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/notifications/ {
        proxy_pass http://notification-service:8002;
    }

    location /api/ {
        proxy_pass http://events-service:8000;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
