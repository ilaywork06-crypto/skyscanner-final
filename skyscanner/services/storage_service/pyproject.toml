[project]
name = "storage-service"
version = "0.1.0"
description = "The service that keeps every uploaded file in the bucket and hands them back to the web client"
requires-python = ">=3.11"
dependencies = [
    "skyscanner-models",
    "skyscanner-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
]

[tool.uv.sources]
skyscanner-models = { workspace = true }
skyscanner-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage_service"]
