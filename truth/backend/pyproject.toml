[project]
name = "truth-service"
version = "0.1.0"
description = "Truth - the register of the working assumptions a project is planned on"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "skyscanner-common",
    "skyscanner-models",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/truth_service"]

[tool.uv.sources]
skyscanner-common = { workspace = true }
skyscanner-models = { workspace = true }
