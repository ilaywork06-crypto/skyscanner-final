# Truth in front of the in-memory stand-in rather than the real service.
#
#     docker compose -f docker-compose.mock.yml up --build
#
# Two containers and no document store: the stand-in holds its register in memory, so restarting it puts the
# data back the way it started. That is what it is for - a register that is the same on every run, for
# working on the client without caring what is behind it. Nothing written through it survives.
name: truth-mock

services:
  truth-api:
    build:
      context: ../..
      dockerfile: truth/Dockerfile.mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/industry?offset=0&limit=1')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    networks:
      - truth

  web:
    build:
      context: ../..
      dockerfile: truth/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_DEFAULT_CREATOR: ${TRUTH_DEFAULT_CREATOR:-}
    restart: unless-stopped
    environment:
      TRUTH_API_URL: http://truth-api:8000/
    ports:
      - "${TRUTH_PORT:-8090}:80"
    depends_on:
      truth-api:
        condition: service_healthy
    networks:
      - truth

networks:
  truth:
    driver: bridge
